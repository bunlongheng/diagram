name: Prod monitor

# Uptime + auth monitor. Hits prod every 15 min and asserts login/data are
# healthy. A failed run emails the repo owner (GitHub's default scheduled-job
# notification), so a silent outage like the Aug 4 auth break gets caught in
# minutes instead of days. Also runs on every push to main as a post-deploy
# smoke test.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://diagrams-bheng.vercel.app
    steps:
      - name: Health endpoint is 200 + ok:true (auth config + DB)
        run: |
          set -euo pipefail
          out=$(curl -sS --max-time 20 -w '\n%{http_code}' "$BASE_URL/api/health")
          code=$(printf '%s' "$out" | tail -n1)
          body=$(printf '%s' "$out" | sed '$d')
          echo "$body"
          [ "$code" = "200" ] || { echo "::error::/api/health HTTP $code"; exit 1; }
          printf '%s' "$body" | grep -q '"ok":true' || { echo "::error::/api/health not ok"; exit 1; }

      - name: NextAuth booted (providers list, not the config-error page)
        run: |
          set -euo pipefail
          out=$(curl -sS --max-time 20 -w '\n%{http_code}' "$BASE_URL/api/auth/providers")
          code=$(printf '%s' "$out" | tail -n1)
          body=$(printf '%s' "$out" | sed '$d')
          echo "$body"
          [ "$code" = "200" ] || { echo "::error::/api/auth/providers HTTP $code"; exit 1; }
          printf '%s' "$body" | grep -q '"google"' || { echo "::error::google provider missing - auth misconfigured"; exit 1; }
